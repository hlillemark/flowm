# @package _global_


dataset:
  # Blockworld dataset stores actions as t -> t+1, while the RSSM should consume
  # the action aligned with the current frame transition from t-1 -> t.
  cond_alignment: "t-1->t"
  max_frames: 70
  n_frames: 200
  cond_loading_style: "action_int"
  latent:
    enable: false
    type: online

algorithm:
  tasks:
    prediction:
      context_frames: 50

  logging:
    loss_freq: 10

experiment:
  devices: [0]
  ema:
    enable: false
  training:
    batch_size: 4
    lr: 4e-5
    strategy: ddp
    precision: 32-true
    dataloader:
      num_workers: 8
      shuffle: True

    max_epochs: -1

    checkpointing:
      every_n_train_steps: 5000
      every_n_epochs: null
    optim:
      optimizer_beta: [0.9, 0.99]
      gradient_clip_val: 1.0
      opt_name: adamw
    weight_decay: 1e-3
    lr_scheduler:
      name: constant

    compile: ${algorithm.compile}
    splits_included: ['sunday_v2_training']

  validation:
    batch_size: 4
    precision: 32-true

    val_every_n_step: 500
    val_every_n_epoch: null
    limit_batch: 1.0
    dataloader:
      num_workers: 4
      shuffle: false

    num_sanity_val_steps: 1
    splits_included: ['sunday_v2_validation']
    sample_during_training: true
